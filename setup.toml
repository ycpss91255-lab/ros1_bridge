[[image.rules]]
rule = "string:ros1_bridge"

[[image.rules]]
rule = "prefix:docker_"

[[image.rules]]
rule = "suffix:_ws"

[[image.rules]]
rule = "@basename"

[build]
target_arch = ""

[[build.args]]
key = "APT_MIRROR_UBUNTU"
value = "tw.archive.ubuntu.com"

[[build.args]]
key = "APT_MIRROR_DEBIAN"
value = "mirror.twds.com.tw"

[[build.args]]
key = "TZ"
value = "Asia/Taipei"

[[build.args]]
key = "ROS2_DISTRO"
value = "humble"

[deploy]
gpu_mode = "auto"
gpu_count = "all"
gpu_capabilities = "gpu compute utility graphics"

[gui]
mode = "auto"

[network]
mode = "host"
ipc = "host"
network_name = ""
ports = []

[security]
privileged = true
cap_drop = []

[[security.cap_add]]
cap = "SYS_ADMIN"

[[security.cap_add]]
cap = "NET_ADMIN"

[[security.cap_add]]
cap = "MKNOD"

[[security.security_opt]]
opt = "seccomp:unconfined"

[resources]
shm_size = ""

[devices]
cgroup_rules = []

[[devices.bindings]]
path = "/dev:/dev"

[[volumes]]
source = "${WS_PATH}"
target = "/home/${USER_NAME}/work"

[logging]
driver = "json-file"
max_size = "10m"
max_file = 3
compress = true
local_path = "./log/"

